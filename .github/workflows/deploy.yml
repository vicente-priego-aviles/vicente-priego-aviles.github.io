name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # La lista de textos prohibidos es privada: vive en el secreto PRIVACIDAD_LISTA.
      # Sin el secreto, el comprobador falla y no se publica nada.
      - name: Privacidad del código
        env:
          PRIVACIDAD_LISTA: ${{ secrets.PRIVACIDAD_LISTA }}
        run: python3 -I scripts/comprobar-privacidad.py --versionados .

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Comprobar la web generada
        run: node scripts/comprobar-dist.mjs dist

      - name: Privacidad de la web generada
        env:
          PRIVACIDAD_LISTA: ${{ secrets.PRIVACIDAD_LISTA }}
        run: python3 -I scripts/comprobar-privacidad.py dist

      - name: Subir la web
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Las webs de otros repos en el mismo dominio deben seguir respondiendo (CA4)
      - name: Comprobar el sitio publicado
        run: |
          for ruta in / /en/ /proyectos/ /en/projects/ /meta-harness/ /bartop-arcade/; do
            curl -fsS --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null "https://vicente-priego-aviles.github.io$ruta"
            echo "✔ $ruta"
          done
